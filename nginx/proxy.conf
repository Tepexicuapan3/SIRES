# Reverse proxy único expuesto al mundo. Todo lo demás (backend, frontend,
# auth-db, redis) vive en la red interna de docker compose, sin puertos
# publicados al host.
#
# NOTA: esto sirve por HTTP y por IP. Let's Encrypt/certbot NO emite
# certificados para IPs sueltas, solo para dominios. Cuando tengan un
# dominio apuntando a esta IP, se agrega un server{} en :443 con ssl_certificate
# (certbot) y este bloque de :80 pasa a ser solo el redirect a https.
#nginx/proxy.conf

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # API + admin de Django -> backend (daphne)
    location ~ ^/(api|django-admin)/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets (channels) -> backend, con upgrade de conexión
    location /ws/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # Todo lo demás -> frontend (estáticos servidos por su propio nginx)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Portal de autoservicio "Citas en Línea" (Fase F5) ──────────────────────
# Mismo backend Django que el bloque de arriba (misma DB, mismo monolito),
# pero servido por un frontend propio (./portal-citas-frontend, servicio
# "portal-frontend") y detrás de un dominio público separado del sistema
# interno.
#
# Este proyecto todavía no tiene un dominio real ni certificado: este archivo
# NO usa el mecanismo de templates/envsubst de la imagen oficial de nginx
# (no hay ningún /etc/nginx/templates/*.template en este proyecto -- ver
# docker-compose.yml, que monta este archivo tal cual en
# /etc/nginx/conf.d/default.conf), así que seguimos el mismo patrón que el
# bloque de arriba: placeholder de dominio comentado, sin inventar un
# mecanismo de configuración nuevo.
#
# TODO (deploy): cuando haya dominio real, volver a diferenciar por
# server_name (como el bloque de arriba) y agregar ese dominio a
# DJANGO_CORS_ALLOWED_ORIGINS / DJANGO_CSRF_TRUSTED_ORIGINS en el .env.
# Mientras tanto (sin dominio, solo IP), se difierencia por PUERTO: nginx no
# puede matchear server_name contra una IP pelada (el Host header siempre es
# la IP para los dos sitios), asi que este bloque escucha en :8081 en vez de
# competir por :80 con el bloque de arriba.
#
# TODO (deploy): esto sirve por HTTP sin TLS. Cuando haya dominio real,
# agregar un server{} en :443 con ssl_certificate (certbot).
server {
    listen 8081;
    server_name _;

    client_max_body_size 20M;

    # API + admin de Django -> backend (mismo backend:5000 que el dominio interno)
    location ~ ^/(api|django-admin)/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo lo demás -> portal-frontend (estáticos servidos por su propio nginx)
    location / {
        proxy_pass http://portal-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
